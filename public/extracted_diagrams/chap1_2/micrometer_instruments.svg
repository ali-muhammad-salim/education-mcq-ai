<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 220" width="100%" height="100%" style="background:#ffffff; font-family: Inter, system-ui, -apple-system, sans-serif;">
  <text x="310" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Measuring Instruments</text>

  <!-- Instrument A: Ruler -->
  <g transform="translate(20, 45)">
    <rect x="0" y="0" width="130" height="135" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
    <!-- Ruler body -->
    <rect x="15" y="55" width="100" height="24" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <!-- Ticks -->
    <line x1="25" y1="55" x2="25" y2="67" stroke="#b45309" stroke-width="1.5"/>
    <line x1="35" y1="55" x2="35" y2="63" stroke="#b45309" stroke-width="1"/>
    <line x1="45" y1="55" x2="45" y2="67" stroke="#b45309" stroke-width="1.5"/>
    <line x1="55" y1="55" x2="55" y2="63" stroke="#b45309" stroke-width="1"/>
    <line x1="65" y1="55" x2="65" y2="67" stroke="#b45309" stroke-width="1.5"/>
    <line x1="75" y1="55" x2="75" y2="63" stroke="#b45309" stroke-width="1"/>
    <line x1="85" y1="55" x2="85" y2="67" stroke="#b45309" stroke-width="1.5"/>
    <line x1="95" y1="55" x2="95" y2="63" stroke="#b45309" stroke-width="1"/>
    <line x1="105" y1="55" x2="105" y2="67" stroke="#b45309" stroke-width="1.5"/>
    <text x="65" y="115" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">A. Meter Rule</text>
  </g>

  <!-- Instrument B: Physical Balance -->
  <g transform="translate(165, 45)">
    <rect x="0" y="0" width="135" height="135" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
    <!-- Pillar -->
    <line x1="67" y1="35" x2="67" y2="85" stroke="#4b5563" stroke-width="3"/>
    <!-- Base -->
    <rect x="35" y="85" width="65" height="6" fill="#374151" rx="2"/>
    <!-- Beam -->
    <line x1="30" y1="40" x2="105" y2="40" stroke="#4b5563" stroke-width="3"/>
    <!-- Pan strings & pans -->
    <line x1="35" y1="40" x2="25" y2="65" stroke="#6b7280" stroke-width="1"/>
    <line x1="35" y1="40" x2="45" y2="65" stroke="#6b7280" stroke-width="1"/>
    <path d="M 20,65 Q 35,73 50,65 Z" fill="#9ca3af"/>
    
    <line x1="100" y1="40" x2="90" y2="65" stroke="#6b7280" stroke-width="1"/>
    <line x1="100" y1="40" x2="110" y2="65" stroke="#6b7280" stroke-width="1"/>
    <path d="M 85,65 Q 100,73 115,65 Z" fill="#9ca3af"/>

    <text x="67" y="115" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">B. Physical Balance</text>
  </g>

  <!-- Instrument C: Micrometer Screw Gauge (Correct!) -->
  <g transform="translate(315, 45)">
    <rect x="0" y="0" width="145" height="135" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <!-- U-frame -->
    <path d="M 45,45 C 10,45 10,85 45,85 L 60,85 C 30,85 30,55 60,55 Z" fill="#047857"/>
    <!-- Anvil & Spindle -->
    <rect x="43" y="47" width="6" height="8" fill="#6b7280"/>
    <rect x="58" y="47" width="15" height="8" fill="#9ca3af"/>
    <!-- Sleeve -->
    <rect x="73" y="44" width="30" height="14" fill="#cbd5e1" stroke="#475569" stroke-width="1"/>
    <!-- Thimble & Ratchet -->
    <path d="M 103,40 L 125,44 L 125,58 L 103,62 Z" fill="#94a3b8" stroke="#334155" stroke-width="1"/>
    <rect x="125" y="47" width="8" height="8" fill="#64748b"/>

    <text x="72" y="115" text-anchor="middle" font-size="13" font-weight="800" fill="#047857">C. Screw Gauge</text>
  </g>

  <!-- Instrument D: Measuring Cylinder -->
  <g transform="translate(475, 45)">
    <rect x="0" y="0" width="125" height="135" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
    <!-- Glass Cylinder -->
    <rect x="45" y="30" width="35" height="65" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <!-- Base -->
    <polygon points="35,95 90,95 85,99 40,99" fill="#0369a1"/>
    <!-- Graduations -->
    <line x1="45" y1="40" x2="55" y2="40" stroke="#0284c7" stroke-width="1"/>
    <line x1="45" y1="50" x2="60" y2="50" stroke="#0284c7" stroke-width="1.5"/>
    <line x1="45" y1="60" x2="55" y2="60" stroke="#0284c7" stroke-width="1"/>
    <line x1="45" y1="70" x2="60" y2="70" stroke="#0284c7" stroke-width="1.5"/>
    <line x1="45" y1="80" x2="55" y2="80" stroke="#0284c7" stroke-width="1"/>
    
    <text x="62" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">D. Cylinder</text>
  </g>
</svg>
