<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 380" width="100%" height="100%" style="background:#ffffff; font-family: Inter, system-ui, -apple-system, sans-serif;">
  <defs>
    <pattern id="grid" width="40" height="35" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 35" fill="none" stroke="#d1d5db" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Title / Label -->
  <text x="250" y="25" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">Distance-Time Graph</text>

  <!-- Grid area: (70, 45) to (430, 325) => width = 360 (9 intervals of 40 = 18 hrs), height = 280 (8 intervals of 35 = 16 km) -->
  <g transform="translate(70, 45)">
    <!-- Grid background -->
    <rect width="360" height="280" fill="url(#grid)" stroke="#9ca3af" stroke-width="1.5"/>

    <!-- Y-Axis labels (Distance in km: 0 to 16, step 2) -->
    <!-- y = 280 is 0 km, y = 245 is 2 km, ..., y = 0 is 16 km -->
    <text x="-12" y="285" text-anchor="end" font-size="12" fill="#374151">0</text>
    <text x="-12" y="250" text-anchor="end" font-size="12" fill="#374151">2</text>
    <text x="-12" y="215" text-anchor="end" font-size="12" fill="#374151">4</text>
    <text x="-12" y="180" text-anchor="end" font-size="12" fill="#374151">6</text>
    <text x="-12" y="145" text-anchor="end" font-size="12" fill="#374151">8</text>
    <text x="-12" y="110" text-anchor="end" font-size="12" fill="#374151">10</text>
    <text x="-12" y="75" text-anchor="end" font-size="12" fill="#374151">12</text>
    <text x="-12" y="40" text-anchor="end" font-size="12" fill="#374151">14</text>
    <text x="-12" y="5" text-anchor="end" font-size="12" fill="#374151">16</text>

    <!-- X-Axis labels (Time in hrs: 0 to 18, step 2) -->
    <!-- x = 0 is 0h, x = 40 is 2h, ..., x = 200 is 10h, x = 240 is 12h, x = 320 is 16h, x = 360 is 18h -->
    <text x="0" y="300" text-anchor="middle" font-size="12" fill="#374151">0</text>
    <text x="40" y="300" text-anchor="middle" font-size="12" fill="#374151">2</text>
    <text x="80" y="300" text-anchor="middle" font-size="12" fill="#374151">4</text>
    <text x="120" y="300" text-anchor="middle" font-size="12" fill="#374151">6</text>
    <text x="160" y="300" text-anchor="middle" font-size="12" fill="#374151">8</text>
    <text x="200" y="300" text-anchor="middle" font-size="12" fill="#1d4ed8" font-weight="700">10</text>
    <text x="240" y="300" text-anchor="middle" font-size="12" fill="#1d4ed8" font-weight="700">12</text>
    <text x="280" y="300" text-anchor="middle" font-size="12" fill="#374151">14</text>
    <text x="320" y="300" text-anchor="middle" font-size="12" fill="#374151">16</text>
    <text x="360" y="300" text-anchor="middle" font-size="12" fill="#374151">18</text>

    <!-- Highlighted Interval between 10 and 12 hrs -->
    <rect x="200" y="0" width="40" height="280" fill="#3b82f6" fill-opacity="0.08"/>

    <!-- Plot line:
         (0, 0) -> x=0, y=280
         (10, 10) -> x=200, y=105 (since 10km = 5*35 from bottom = 280 - 175 = 105)
         (12, 10) -> x=240, y=105 (horizontal flat line!)
         (16, 14) -> x=320, y=35 (14km = 7*35 from bottom = 280 - 245 = 35)
    -->
    <polyline points="0,280 200,105 240,105 320,35" fill="none" stroke="#111827" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Points on graph -->
    <circle cx="0" cy="280" r="4" fill="#111827"/>
    <circle cx="200" cy="105" r="4.5" fill="#2563eb"/>
    <circle cx="240" cy="105" r="4.5" fill="#2563eb"/>
    <circle cx="320" cy="35" r="4" fill="#111827"/>

    <!-- Bracket or indicator for 10-12 hrs -->
    <path d="M 200,115 L 200,125 L 240,125 L 240,115" fill="none" stroke="#2563eb" stroke-width="1.5"/>
    <text x="220" y="140" text-anchor="middle" font-size="11" font-weight="600" fill="#2563eb">Flat (0 km change)</text>
  </g>

  <!-- Axis Titles -->
  <text x="250" y="370" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Time (hrs)</text>
  <text x="22" y="185" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937" transform="rotate(-90 22 185)">Distance (km)</text>
</svg>
