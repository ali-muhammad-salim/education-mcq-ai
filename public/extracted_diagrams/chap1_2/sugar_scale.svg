<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 340" width="100%" height="100%" style="background:#ffffff; font-family: Inter, system-ui, -apple-system, sans-serif;">
  <text x="225" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">Electronic Balance &amp; Sugar Container</text>

  <!-- Digital Scale Base (3D perspective) -->
  <g transform="translate(110, 140)">
    <!-- Scale Top Pan -->
    <polygon points="40,25 190,25 155,75 5,75" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>

    <!-- Scale Front & Sides -->
    <polygon points="5,75 155,75 155,140 5,140" fill="#cbd5e1" stroke="#334155" stroke-width="2"/>
    <polygon points="155,75 190,25 190,90 155,140" fill="#94a3b8" stroke="#334155" stroke-width="2"/>

    <!-- Digital Display Screen on front face -->
    <rect x="25" y="85" width="105" height="40" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="77" y="112" text-anchor="middle" font-family="'Courier New', monospace" font-size="22" font-weight="800" fill="#38bdf8">1008.9 g</text>

    <!-- Sugar Container sitting on top pan -->
    <!-- Container Body -->
    <rect x="60" y="-85" width="75" height="95" rx="3" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
    <line x1="60" y1="-80" x2="135" y2="-80" stroke="#cbd5e1" stroke-width="2"/>

    <!-- Sugar bag inside container -->
    <rect x="66" y="-75" width="63" height="75" rx="2" fill="#3b82f6" fill-opacity="0.15" stroke="#2563eb" stroke-width="1.5"/>
    <text x="97" y="-45" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">Sugar</text>
    <text x="97" y="-28" text-anchor="middle" font-size="13" font-weight="800" fill="#1d4ed8">1 kg</text>
    <text x="97" y="-12" text-anchor="middle" font-size="10" font-weight="600" fill="#475569">(= 1000 g)</text>

    <!-- Callout line for sugar bag -->
    <line x1="66" y1="-50" x2="10" y2="-50" stroke="#64748b" stroke-width="1.5"/>
    <text x="5" y="-50" text-anchor="end" font-size="12" font-weight="600" fill="#475569">Sugar (1000 g)</text>

    <!-- Callout line for container -->
    <line x1="135" y1="-30" x2="190" y2="-30" stroke="#64748b" stroke-width="1.5"/>
    <text x="195" y="-30" text-anchor="start" font-size="12" font-weight="600" fill="#475569">Container</text>
  </g>

  <!-- Calculation Note -->
  <text x="225" y="315" text-anchor="middle" font-size="13" font-weight="600" fill="#059669">
    Mass of empty container = 1008.9 g − 1000 g = 8.9 g
  </text>
</svg>
