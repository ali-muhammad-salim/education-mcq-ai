<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 250" width="360" height="250" style="background:#ffffff; border-radius:8px;">
  <!-- Axes -->
  <line x1="60" y1="200" x2="330" y2="200" stroke="#1e293b" stroke-width="2" />
  <line x1="60" y1="200" x2="60" y2="25" stroke="#1e293b" stroke-width="2" />

  <polygon points="330,200 322,195 322,205" fill="#1e293b" />
  <polygon points="60,25 55,33 65,33" fill="#1e293b" />

  <text x="180" y="235" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#334155">Time ──► t</text>
  <text x="22" y="115" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#334155" transform="rotate(-90 22 115)">Velocity ──►</text>
  <text x="45" y="215" font-family="sans-serif" font-size="14" font-weight="bold" fill="#64748b">0</text>

  <!-- Shaded Region Under WX -->
  <polygon points="60,130 270,60 270,200 60,200" fill="#cbd5e1" stroke="none" />
  <line x1="60" y1="130" x2="270" y2="130" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3,3" />

  <!-- Dotted lines to axes -->
  <line x1="60" y1="60" x2="270" y2="60" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3" />
  <line x1="270" y1="60" x2="270" y2="200" stroke="#1e293b" stroke-width="2" />

  <!-- WX Line -->
  <line x1="60" y1="130" x2="270" y2="60" stroke="#0b5e4a" stroke-width="3.5" />

  <!-- Points and Labels -->
  <circle cx="60" cy="130" r="4" fill="#0b5e4a" />
  <text x="68" y="145" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0b5e4a">W</text>
  <text x="35" y="135" font-family="serif" font-size="14" font-style="italic" fill="#1e293b">Vi</text>

  <circle cx="270" cy="60" r="4" fill="#0b5e4a" />
  <text x="280" y="65" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0b5e4a">X</text>
  <text x="35" y="65" font-family="serif" font-size="14" font-style="italic" fill="#1e293b">Vf</text>

  <text x="65" y="75" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e293b">E</text>
  <text x="280" y="135" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Y</text>
  <text x="270" y="220" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Z</text>
</svg>
