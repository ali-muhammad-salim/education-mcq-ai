<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 240" width="380" height="240" style="background:#ffffff; border-radius:8px;">
  <!-- Grid lines -->
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e2e8f0" stroke-width="1"/>
    </pattern>
  </defs>
  <rect x="50" y="20" width="300" height="180" fill="url(#grid)" />

  <!-- Axes -->
  <line x1="50" y1="200" x2="360" y2="200" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="50" y1="200" x2="50" y2="15" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)" />
  
  <text x="200" y="228" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#334155">Time (s)</text>
  <text x="18" y="110" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#334155" transform="rotate(-90 18 110)">Distance (m)</text>

  <!-- Plot line -->
  <!-- 0 to (110, 100), plateau to (150, 100), rise to X(200, 40), fall to Y(310, 200) -->
  <path d="M 50 200 L 110 110 L 150 110 L 200 40 L 310 200" fill="none" stroke="#2563eb" stroke-width="3" />

  <!-- Points X and Y -->
  <circle cx="200" cy="40" r="5" fill="#dc2626" />
  <text x="215" y="38" font-family="sans-serif" font-size="16" font-weight="bold" fill="#dc2626">X</text>

  <circle cx="310" cy="200" r="5" fill="#dc2626" />
  <text x="325" y="198" font-family="sans-serif" font-size="16" font-weight="bold" fill="#dc2626">Y</text>

  <!-- Highlighting slope from X to Y -->
  <line x1="200" y1="40" x2="310" y2="200" stroke="#dc2626" stroke-width="3.5" />
</svg>
