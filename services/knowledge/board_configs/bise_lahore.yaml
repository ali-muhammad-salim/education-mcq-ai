# BISE Lahore — Board of Intermediate and Secondary Education, Lahore

id: "bise_lahore"
name: "Board of Intermediate and Secondary Education Lahore"
short_code: "BISE-Lahore"
country: "Pakistan"
description: >
  BISE Lahore is one of the oldest and largest educational boards in Punjab,
  responsible for Matric and Intermediate examinations in the Lahore Division.
status: "ACTIVE"
website: "https://biselahore.com"
headquarters: "Lahore"
established_year: 1954

